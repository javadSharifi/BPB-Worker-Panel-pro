<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPB Panel v__VERSION__</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="data:image/x-icon;base64,__ICON__">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=login,visibility,visibility_off&display=block" rel="stylesheet" />
    <style>/* CSS_PLACEHOLDER */</style>
</head>

<body>
    <!-- Theme Toggle Pill -->
    <div class="theme-pill">
        <button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    </div>

    <div class="login-container">
        <div class="glass-card">
            <div class="logo-section">
                <span class="logo-icon">💦</span>
                <span class="logo-text">BPB Panel</span>
            </div>
            <div class="version-text">v__VERSION__</div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Cloudflare Email</label>
                    <input class="neon-input" type="email" id="username" name="username" placeholder="user@example.com" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input class="neon-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-vis" id="togglePassword" title="Show/hide password">
                            <span class="material-symbols-rounded">visibility_off</span>
                        </button>
                    </div>
                </div>

                <div id="passwordError" class="error-msg"></div>

                <button type="submit" class="btn-neon">
                    <span class="material-symbols-rounded">login</span>
                    <span>Sign In</span>
                </button>
            </form>
        </div>
    </div>
    <script>/* JS_PLACEHOLDER */</script>
</body>

</html>
